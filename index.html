<!-- ══════════ BAÉQ 3D CAP VIEWER — tampal sebelum </body> ══════════ -->
<style>
.cap3d-wrap{width:100%;max-width:430px;margin-inline:auto}
.cap3d-frame{padding:12px;border-radius:999px 999px 24px 24px;background:var(--bg-card);border:1px solid var(--line);box-shadow:0 28px 70px rgba(17,17,17,.13)}
.cap3d-glass{position:relative;overflow:hidden;border-radius:999px 999px 16px 16px;aspect-ratio:3/4.1;background:linear-gradient(160deg,#edeae5,#d8d4cf 58%,#b8b4ae)}
.cap3d-glass canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;outline-offset:-4px}
.cap3d-hint{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid rgba(255,255,255,.6);border-radius:999px;background:rgba(17,17,17,.42);backdrop-filter:blur(9px);color:#fff;font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;pointer-events:none;z-index:2}
.cap3d-hint i{width:6px;height:6px;border-radius:50%;background:#d9c3aa;box-shadow:0 0 0 5px rgba(217,195,170,.17)}
.cap3d-controls{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:center;gap:8px;z-index:2}
.cap3d-controls button{min-width:40px;min-height:40px;padding:0 13px;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:rgba(17,17,17,.42);backdrop-filter:blur(9px);color:#fff;font:600 .68rem 'Inter',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .25s,transform .2s}
.cap3d-controls button:hover{background:rgba(17,17,17,.65);transform:translateY(-2px)}
.cap3d-controls button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.cap3d-name{display:block;margin-top:15px;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:1.2rem;color:var(--ink);font-weight:600;text-align:center}
.cap3d-loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;z-index:1}
@media(max-width:640px){.cap3d-wrap{max-width:390px}.cap3d-hint{font-size:.55rem;top:12px}.cap3d-controls button{min-height:42px}}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const mwrap = document.querySelector('.mwrap');
const mirrors = document.getElementById('mirrors');
if (mwrap && mirrors) { try { boot(); } catch (e) { console.warn('3D viewer → fallback cermin asal:', e); } }

function boot(){
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- UI ---- */
  const wrap = document.createElement('div');
  wrap.className = 'cap3d-wrap';
  wrap.innerHTML =
    '<div class="cap3d-frame"><div class="cap3d-glass">' +
    '<canvas tabindex="0" role="application" aria-label="Model 3D inner cap. Seret atau guna butang anak panah untuk pusing 360 darjah."></canvas>' +
    '<div class="cap3d-loading">Memuatkan 3D…</div>' +
    '<div class="cap3d-hint"><i></i>360° · seret untuk pusing</div>' +
    '<div class="cap3d-controls">' +
    '<button type="button" class="c3-left" aria-label="Pusing ke kiri">⟲</button>' +
    '<button type="button" class="c3-auto" aria-pressed="true" aria-label="Auto pusing">Auto ⏸</button>' +
    '<button type="button" class="c3-right" aria-label="Pusing ke kanan">⟳</button>' +
    '<button type="button" class="c3-tudung" aria-pressed="false" aria-label="Tunjuk layer tudung">Tudung ✕</button>' +
    '</div></div></div>' +
    '<span class="cap3d-name" aria-live="polite">Latte</span>';
  mwrap.insertBefore(wrap, mirrors);
  mirrors.style.display = 'none';

  const glass = wrap.querySelector('.cap3d-glass');
  const canvas = wrap.querySelector('canvas');
  const nameEl = wrap.querySelector('.cap3d-name');

  function fallback(){
    wrap.remove();
    mirrors.style.display = '';
  }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:'high-performance' });
  } catch(e){ fallback(); return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(36, 3/4.1, 0.1, 40);
  camera.position.set(0, 1.7, 4.7);

  const key = new THREE.DirectionalLight(0xfff2e2, 2.6); key.position.set(3,5,4); scene.add(key);
  const fill = new THREE.DirectionalLight(0xbfd0e0, 1.0); fill.position.set(-4,2,3); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xd9c3aa, 2.0); rim.position.set(-2,3,-4); scene.add(rim);
  scene.add(new THREE.AmbientLight(0x8a8f94, 0.55));

  /* ---- MODEL ---- */
  const spin = new THREE.Group(); scene.add(spin);
  const matCeramic = new THREE.MeshStandardMaterial({ color:0xEDE7DE, roughness:0.55, metalness:0, envMapIntensity:0.5 });
  const matBase = new THREE.MeshStandardMaterial({ color:0x2b2b2e, roughness:0.4, metalness:0.6 });
  const matBrass = new THREE.MeshStandardMaterial({ color:0x8A7B6B, roughness:0.32, metalness:0.9, envMapIntensity:1.2 });

  const startHex = (window.cur && window.cur[1]) || '#C9A98B';
  const capTarget = new THREE.Color(startHex);
  const bandTarget = capTarget.clone().multiplyScalar(0.88);
  const tudungTarget = capTarget.clone().multiplyScalar(0.78);
  const sheenTarget = capTarget.clone().lerp(new THREE.Color(0xffffff), 0.5);

  const matCap = new THREE.MeshPhysicalMaterial({ color:capTarget.clone(), roughness:0.85, metalness:0, sheen:1, sheenRoughness:0.55, sheenColor:sheenTarget.clone(), envMapIntensity:0.7, side:THREE.DoubleSide });
  const matBand = new THREE.MeshPhysicalMaterial({ color:bandTarget.clone(), roughness:0.8, metalness:0, sheen:0.6, sheenRoughness:0.6, envMapIntensity:0.6 });
  const matTudung = new THREE.MeshPhysicalMaterial({ color:tudungTarget.clone(), roughness:0.92, metalness:0, sheen:1, sheenRoughness:0.7, sheenColor:sheenTarget.clone(), envMapIntensity:0.55, side:THREE.DoubleSide });

  // Tapak + tiang
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.7, 0.12, 40), matBase); base.position.y = 0.06; spin.add(base);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.5, 14), matBrass); pole.position.y = 0.36; spin.add(pole);

  // Bahu / bust (lathe)
  const bustPts = [[0.001,0.60],[0.50,0.60],[0.52,0.66],[0.47,0.80],[0.36,0.94],[0.22,1.05],[0.155,1.14],[0.145,1.30]].map(p=>new THREE.Vector2(p[0],p[1]));
  spin.add(new THREE.Mesh(new THREE.LatheGeometry(bustPts, 44), matCeramic));

  // Leher + kepala (mannequin abstrak)
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.145, 0.15, 0.34, 20), matCeramic); neck.position.y = 1.36; spin.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 40, 30), matCeramic);
  head.scale.set(0.84, 1.02, 0.9); head.position.y = 1.74; spin.add(head);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 14, 10), matCeramic);
  nose.scale.set(0.7, 1.1, 0.8); nose.position.set(0, 1.68, 0.365); spin.add(nose);

  // Inner cap + band (produk utama)
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.475, 44, 30, 0, Math.PI*2, 0, Math.PI*0.68), matCap);
  cap.scale.set(0.86, 1.04, 0.92); cap.position.y = 1.755; cap.rotation.x = -0.20; spin.add(cap);
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.403, 0.028, 12, 44), matBand);
  band.rotation.x = Math.PI/2; band.position.y = -0.252; cap.add(band);

  // Layer tudung (toggle) — bukaan di hadapan supaya muka nampak
  const tudungPts = [[0.02,2.30],[0.26,2.26],[0.44,2.10],[0.52,1.86],[0.55,1.58],[0.60,1.30],[0.70,1.02],[0.80,0.78],[0.84,0.66]].map(p=>new THREE.Vector2(p[0],p[1]));
  const tudung = new THREE.Mesh(new THREE.LatheGeometry(tudungPts, 48, Math.PI*0.24, Math.PI*1.52), matTudung);
  tudung.visible = false; tudung.scale.setScalar(0.92); spin.add(tudung);
  let tudungOn = false, tudungScale = 0.92;

  // Cincin brass di belakang (kedalaman "cermin")
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.02, 0.018, 10, 60), matBrass);
  ring.position.set(0, 1.5, -0.6); scene.add(ring);

  // Bayang blob (tanpa shadow map — ringan)
  const shCanvas = document.createElement('canvas'); shCanvas.width = shCanvas.height = 128;
  const sg = shCanvas.getContext('2d');
  const grad = sg.createRadialGradient(64,64,6,64,64,64);
  grad.addColorStop(0,'rgba(0,0,0,.5)'); grad.addColorStop(1,'rgba(0,0,0,0)');
  sg.fillStyle = grad; sg.fillRect(0,0,128,128);
  const shTex = new THREE.CanvasTexture(shCanvas);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.4,2.4), new THREE.MeshBasicMaterial({ map:shTex, transparent:true, opacity:0.55, depthWrite:false }));
  shadow.rotation.x = -Math.PI/2; shadow.position.y = 0.002; scene.add(shadow);

  // Habuk halus
  const dustN = 60, dustPos = new Float32Array(dustN*3), dustSeed = [];
  for (let i=0;i<dustN;i++){ dustSeed.push([Math.random()*2.4-1.2, 0.2+Math.random()*2.4, Math.random()*2-1, Math.random()*6.28]); }
  const dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos,3));
  const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color:0xd9c3aa, size:0.02, transparent:true, opacity:0.4, depthWrite:false, blending:THREE.AdditiveBlending }));
  scene.add(dust);

  /* ---- KAWALAN 360° ---- */
  const controls = new OrbitControls(camera, canvas);
  controls.target.set(0, 1.4, 0);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.enablePan = false; controls.enableZoom = false; // scroll page tak terganggu
  controls.rotateSpeed = 0.9;
  controls.minPolarAngle = Math.PI*0.2; controls.maxPolarAngle = Math.PI*0.6;
  controls.touches.ONE = THREE.TOUCH.ROTATE;
  canvas.style.touchAction = 'pan-y'; // swipe menegak = scroll page, mendatar = pusing
  controls.update(); controls.saveState();

  let autoSpin = !RM, baseSpin = 0, offset = 0, offsetTarget = 0;
  let interacting = false, lastInteract = -10;
  controls.addEventListener('start', ()=>{ interacting = true; });
  controls.addEventListener('end', ()=>{ interacting = false; lastInteract = performance.now()/1000; });

  const btnAuto = wrap.querySelector('.c3-auto');
  const btnTudung = wrap.querySelector('.c3-tudung');
  function syncAutoBtn(){ btnAuto.textContent = autoSpin ? 'Auto ⏸' : 'Auto ▶'; btnAuto.setAttribute('aria-pressed', String(autoSpin)); }
  syncAutoBtn();
  btnAuto.onclick = ()=>{ autoSpin = !autoSpin; syncAutoBtn(); };
  wrap.querySelector('.c3-left').onclick = ()=>{ offsetTarget += Math.PI/2; };
  wrap.querySelector('.c3-right').onclick = ()=>{ offsetTarget -= Math.PI/2; };
  btnTudung.onclick = ()=>{
    tudungOn = !tudungOn; tudung.visible = true;
    btnTudung.textContent = tudungOn ? 'Tudung ✓' : 'Tudung ✕';
    btnTudung.setAttribute('aria-pressed', String(tudungOn));
  };
  canvas.addEventListener('dblclick', ()=>{ controls.reset(); });
  canvas.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowLeft'){ e.preventDefault(); offsetTarget += Math.PI/6; }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); offsetTarget -= Math.PI/6; }
  });

  /* ---- SYNC WARNA DENGAN SWATCH / ARROW SEDIA ADA ---- */
  function setCapColor(hex, name){
    capTarget.set(hex);
    bandTarget.copy(capTarget).multiplyScalar(0.88);
    tudungTarget.copy(capTarget).multiplyScalar(0.78);
    sheenTarget.copy(capTarget).lerp(new THREE.Color(0xffffff), 0.5);
    if (name) nameEl.textContent = name;
  }
  const origSetColor = window.setColor;
  window.setColor = function(c, fs){
    if (typeof origSetColor === 'function') origSetColor(c, fs);
    setCapColor(c[1], c[0]);
  };
  if (window.cur) setCapColor(window.cur[1], window.cur[0]);

  /* ---- RESIZE ---- */
  function resize(){
    const w = glass.clientWidth, h = glass.clientHeight;
    if (!w || !h) return;
    camera.aspect = w/h; camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  new ResizeObserver(resize).observe(glass);
  resize();

  /* ---- LOOP (pause bila tab hidden / luar skrin) ---- */
  let inView = true, ok = false, last = performance.now();
  new IntersectionObserver(es=>{ inView = es[0].isIntersecting; }, { threshold:0.02 }).observe(glass);
  document.addEventListener('visibilitychange', ()=>{ last = performance.now(); });

  function frame(now){
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    if (!inView || document.hidden) return;
    const t = now/1000;

    if (autoSpin && !interacting && t - lastInteract > 2) baseSpin += dt*0.35;
    offset += (offsetTarget - offset)*Math.min(1, dt*6);
    spin.rotation.y = baseSpin + offset;

    // warna smooth lerp
    const k = Math.min(1, dt*7);
    matCap.color.lerp(capTarget, k);
    matCap.sheenColor.lerp(sheenTarget, k);
    matBand.color.lerp(bandTarget, k);
    matTudung.color.lerp(tudungTarget, k);
    matTudung.sheenColor.lerp(sheenTarget, k);

    // tudung pop masuk/keluar
    tudungScale += ((tudungOn?1:0.92) - tudungScale)*Math.min(1, dt*8);
    tudung.scale.setScalar(tudungScale);
    if (!tudungOn && tudungScale < 0.925) tudung.visible = false;

    // habuk
    const dsp = RM ? 0 : 1;
    for (let i=0;i<dustN;i++){
      const s = dustSeed[i];
      dustPos[i*3]   = s[0] + Math.sin(t*0.25+s[3])*0.08*dsp;
      dustPos[i*3+1] = s[1] + Math.sin(t*0.3+s[3]*2)*0.1*dsp;
      dustPos[i*3+2] = s[2];
    }
    dustGeo.attributes.position.needsUpdate = true;

    controls.update();
    renderer.render(scene, camera);

    if (!ok){ ok = true; window.__cap3dOK = true; const l = wrap.querySelector('.cap3d-loading'); if (l) l.remove(); }
  }
  requestAnimationFrame(frame);

  // Kalau 3D tak berjaya render dalam 8 saat → pulihkan cermin asal
  setTimeout(()=>{ if (!window.__cap3dOK){ try{ renderer.dispose(); }catch(e){} fallback(); } }, 8000);
}
</script>
<!-- ══════════ TAMAT 3D CAP VIEWER ══════════ -->
